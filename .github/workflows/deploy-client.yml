name: Deploy client to GitHub Pages

# Builds the client and syncs it into the `gh-pages` branch, where the
# branch-native "Deploy site (gh-pages branch)" workflow publishes it via
# GitHub Pages. (deploy-pages cannot run from main: the auto-created
# github-pages environment only permits the gh-pages branch.)
#
# The deployed site runs fully in demo mode (the API client falls back to a
# local dataset + localStorage when no backend is reachable), so it is fully
# interactive without a server.
on:
  push:
    branches: [main]
    paths:
      - "client/**"
      - ".github/workflows/deploy-client.yml"
  workflow_dispatch:

permissions:
  contents: write # push the built site to gh-pages
  pages: read

concurrency:
  group: gh-pages-sync
  cancel-in-progress: true

jobs:
  build-and-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        working-directory: client
        run: npm ci

      - name: Build (subpath base for Pages)
        working-directory: client
        run: npm run build
        env:
          VITE_BASE: /FoodRescue/

      - name: Push build to gh-pages
        working-directory: client
        shell: bash
        run: |
          set -euo pipefail
          REPO="https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"

          # Clone existing gh-pages (keeps its workflow file + history intact)
          git clone --depth 1 --branch gh-pages "$REPO" pages-repo
          cd pages-repo

          # Replace everything except VCS internals and the branch's own
          # Pages-deploy workflow, then add the fresh build + SPA fallback.
          find . -mindepth 1 -maxdepth 1 \
            ! -name .git ! -name .github -exec rm -rf {} +
          cp -r ../dist/. .
          cp dist/index.html 404.html

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to deploy."
          else
            git commit -m "Deploy client build from main@${{ github.sha }}"
            git push origin gh-pages
          fi
